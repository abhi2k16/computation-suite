[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rom_engine"
version = "0.1.0"
description = "A small, from-scratch reduced-order-modeling package for structural engineering analysis: POD basis extraction, intrusive Galerkin projection, and affine parametric decomposition for fast many-query structural analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Structural Mechanics & Computational Engineering Lab" },
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]
fea = ["fea_engine"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
